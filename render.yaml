services:
  - type: web
    name: legimcp
    runtime: python
    plan: free
    region: frankfurt
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Ces deux clés sont marquées "sync: false" : Render vous demandera
      # de saisir leur valeur dans le tableau de bord au moment du déploiement,
      # au lieu de les stocker en clair dans ce fichier (qui est sur GitHub).
      - key: PISTE_CLIENT_ID
        sync: false
      - key: PISTE_CLIENT_SECRET
        sync: false
    healthCheckPath: /
